global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  # ── Ductifact API ──────────────────────────────────────
  - job_name: "ductifact-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  # RustFS exports metrics via OTLP, not a native Prometheus scrape endpoint.
  # Add an OpenTelemetry Collector before enabling storage metrics here.
  # See https://docs.rustfs.com/en/operations/observability

  # ── Prometheus self-monitoring ─────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
