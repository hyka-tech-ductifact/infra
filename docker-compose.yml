name: ductifact-${ENV}

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ductifact_${ENV}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── S3-compatible object storage (RustFS) ──────────────────
  # Keep the service protocol-neutral and the data volume server-specific.
  # Existing objects must be copied via S3 before switching servers.
  s3:
    image: ${S3_IMAGE}
    container_name: ductifact_${ENV}_s3
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${S3_CONSOLE_PORT}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:9000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: ${REDIS_IMAGE}
    container_name: ductifact_${ENV}_redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Backend API ────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE}
    container_name: ductifact_${ENV}_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - BACKEND_HOST=${BACKEND_HOST}
      - BACKEND_PORT=8080
      - RELEASE_VERSION=${RELEASE_VERSION:-unknown}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_TTL_SECONDS=${JWT_ACCESS_TOKEN_TTL_SECONDS}
      - JWT_REFRESH_TOKEN_TTL_SECONDS=${JWT_REFRESH_TOKEN_TTL_SECONDS}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - GIN_MODE=${GIN_MODE}
      - RATE_LIMIT_IP_MAX=${RATE_LIMIT_IP_MAX}
      - RATE_LIMIT_IP_WINDOW_SECONDS=${RATE_LIMIT_IP_WINDOW_SECONDS}
      - RATE_LIMIT_USER_MAX=${RATE_LIMIT_USER_MAX}
      - RATE_LIMIT_USER_WINDOW_SECONDS=${RATE_LIMIT_USER_WINDOW_SECONDS}
      - LOGIN_THROTTLE_MAX_ATTEMPTS=${LOGIN_THROTTLE_MAX_ATTEMPTS}
      - LOGIN_THROTTLE_WINDOW_SECONDS=${LOGIN_THROTTLE_WINDOW_SECONDS}
      - LOGIN_THROTTLE_LOCKOUT_SECONDS=${LOGIN_THROTTLE_LOCKOUT_SECONDS}
      - S3_HOST=s3
      - S3_PORT=9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_USE_SSL=false
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_AUTH=${SMTP_AUTH}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - VERIFICATION_REGISTRATION_OTP_TTL_SECONDS=${VERIFICATION_REGISTRATION_OTP_TTL_SECONDS}
      - VERIFICATION_PASSWORD_RESET_OTP_TTL_SECONDS=${VERIFICATION_PASSWORD_RESET_OTP_TTL_SECONDS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=true
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
    # The runtime image includes BusyBox wget. Readiness checks the database
    # and storage; a running process alone may be in a restart loop.
    healthcheck:
      test: [ "CMD", "wget", "-q", "-T", "15", "-O", "/dev/null", "http://127.0.0.1:8080/readyz" ]
      interval: 5s
      timeout: 16s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Frontend (Angular + Nginx) ─────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: ductifact_${ENV}_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:8080"
    environment:
      - BACKEND_URL=${PUBLIC_BACKEND_URL}
      - JWT_ACCESS_TOKEN_TTL_SECONDS=${JWT_ACCESS_TOKEN_TTL_SECONDS}
      - JWT_REFRESH_TOKEN_TTL_SECONDS=${JWT_REFRESH_TOKEN_TTL_SECONDS}
      - FILE_STORAGE_URL=${PUBLIC_FILE_STORAGE_URL}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: ductifact_${ENV}_prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
    networks:
      - internal

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: ductifact_${ENV}_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - internal

volumes:
  postgres_data:
  rustfs_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
